name: Release

# Publishes @omit/react-confirm-dialog to npm when a version tag is pushed
# (v2.1.0 publishes to `latest`, v2.1.0-rc.1 publishes to `next`).
# Authentication uses npm trusted publishing (OIDC): configure this workflow
# file (release.yml) as a trusted publisher for the package on npmjs.com.
# Provenance attestations are generated automatically by npm.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Verify that the tag matches the package version
        working-directory: packages/confirm-dialog
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v$version" >&2
            exit 1
          fi

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm check-package

      # Prerelease versions (2.1.0-rc.1, 2.1.0-beta.0, ...) go to the `next`
      # dist-tag so that `npm install @omit/react-confirm-dialog` keeps
      # resolving to the last stable release until the final version is tagged.
      - name: Publish to npm
        working-directory: packages/confirm-dialog
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
